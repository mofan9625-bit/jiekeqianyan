# ====================================================================
# 极客前沿 (jikeqianyan.net) - AFF 推广链接 301 永久重定向配置
# 适用环境: VPS / 宝塔面板 Nginx 站点配置
# 引入方法: 在站点的 server { ... } 配置块内加入:
#   include /path/to/nginx-redirects.conf;
# ====================================================================

# 精准匹配 /go/xxx 路径并执行 301 永久重定向
location = /go/yunjiexian {
    return 301 https://9625mofan01.yunjiexianaff.com/#/?code=OOYhSj0L;
}
location = /go/dalaoyun {
    return 301 https://mofanvip01.dalaoyunaff.com/#/?code=QT2rqp5V;
}
location = /go/huanqiuti {
    return 301 https://mofanvip01.huanqiutiaff.com/#/?code=l7oLmjVU;
}
location = /go/liulianyun {
    return 301 https://mofan88.liulianyunaff.com/#/?code=ETsQBSuR;
}
location = /go/shandianshu {
    return 301 https://mofanvip01.shandianshuaff.com/#/?code=a3GAQAXg;
}
location = /go/shenxing {
    return 301 https://vipmofan01.shenxingaff.com/#/?code=nn4ohwnK;
}

# 兼容带尾部斜杠 /go/xxx/ 的请求
location ~* ^/go/(yunjiexian|dalaoyun|huanqiuti|liulianyun|shandianshu|shenxing)/?$ {
    rewrite ^/go/yunjiexian/?$ https://9625mofan01.yunjiexianaff.com/#/?code=OOYhSj0L permanent;
    rewrite ^/go/dalaoyun/?$ https://mofanvip01.dalaoyunaff.com/#/?code=QT2rqp5V permanent;
    rewrite ^/go/huanqiuti/?$ https://mofanvip01.huanqiutiaff.com/#/?code=l7oLmjVU permanent;
    rewrite ^/go/liulianyun/?$ https://mofan88.liulianyunaff.com/#/?code=ETsQBSuR permanent;
    rewrite ^/go/shandianshu/?$ https://mofanvip01.shandianshuaff.com/#/?code=a3GAQAXg permanent;
    rewrite ^/go/shenxing/?$ https://vipmofan01.shenxingaff.com/#/?code=nn4ohwnK permanent;
}

# 针对 /go.html?id=xxx 的 Nginx 服务端毫秒级 301 直跳
if ($arg_id = "yunjiexian") {
    return 301 https://9625mofan01.yunjiexianaff.com/#/?code=OOYhSj0L;
}
if ($arg_id = "dalaoyun") {
    return 301 https://mofanvip01.dalaoyunaff.com/#/?code=QT2rqp5V;
